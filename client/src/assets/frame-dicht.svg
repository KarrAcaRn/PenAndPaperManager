<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Testvariante „dicht belaubt“.
    Zweigrahmen als 9-Slice für border-image (Slice 32): Ecken 32×32, Kanten-Kachel 64×32.
    Der braune Zweig läuft in der Mitte des 32er-Bands (y=16) und beginnt/endet dort waagerecht, damit sich die
    Kacheln nahtlos aneinanderreihen. Kurze Seitenzweige tragen grüne Blätter. Die übrigen Kanten und Ecken sind
    Drehungen um die Bildmitte. Farben passen sich per prefers-color-scheme dem hellen/dunklen Design an.
  -->
  <style>
    .branch { fill: none; stroke: #6b4a2b; stroke-width: 2.3; stroke-linecap: round; }
    .twig { fill: none; stroke: #6b4a2b; stroke-width: 1.1; stroke-linecap: round; }
    .bark { fill: none; stroke: #9a7550; stroke-width: 0.45; stroke-linecap: round; }
    .knot { fill: #4e3520; }
    .leaf { fill: #6f9a3e; stroke: #46652a; stroke-width: 0.5; }
    .vein { fill: none; stroke: #46652a; stroke-width: 0.35; }
    @media (prefers-color-scheme: dark) {
      .branch, .twig { stroke: #9c7651; }
      .bark { stroke: #c49d72; }
      .knot { fill: #6e4f33; }
      .leaf { fill: #4f7a35; stroke: #8fbf6a; }
      .vein { stroke: #8fbf6a; }
    }
  </style>
  <defs>
    <g id="leaf">
      <path class="leaf" d="M0 0 C2 -2.6 6 -2.8 8.6 0 C6 2.8 2 2.6 0 0Z" />
      <path class="vein" d="M0.6 0 L7 0" />
    </g>
    <g id="leaf-small" transform="scale(0.7)"><use href="#leaf" xlink:href="#leaf" /></g>

    <!-- Kante: leicht geknickter Zweig mit Rindenstrich, zwei beblätterten Seitenzweigen und einem Aststummel -->
    <g id="edge">
      <path class="branch" d="M0 16 C8 16 13 14 21 13.6 S34 18.4 43 18.4 S57 16 64 16" />
      <path class="bark" d="M4 15.6 C9 15.4 13 14 18 13.5 M36 17.9 C39 18.3 42 18.2 45 17.9" />
      <ellipse class="knot" cx="31.5" cy="16" rx="1" ry="0.7" transform="rotate(25 31.5 16)" />
      <!-- Aststummel ohne Blatt -->
      <path class="twig" d="M9.5 15.4 L7.4 11.8" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(13.5 14.8) rotate(70)" />
      <!-- Seitenzweig nach oben -->
      <path class="twig" d="M21 13.6 Q24.2 9.6 28.4 7.6" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(28.4 7.6) rotate(-15)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(24.4 10.4) rotate(-115)" />
      <!-- Seitenzweig nach unten -->
      <path class="twig" d="M43 18.4 Q46.4 22.4 50.6 24" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(50.6 24) rotate(18)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(46.8 21.6) rotate(110)" />
      <!-- zusätzliche Blätter direkt am Zweig -->
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(4 16) rotate(-60)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(33.5 16.6) rotate(-70)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(37 17.6) rotate(75)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(57 16.4) rotate(-55)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(25 15.2) rotate(65)" />
    </g>

    <!-- Ecke: Zweig biegt um die Ecke, nach außen gabelt sich ein Seitenast mit Blattbüschel -->
    <g id="corner">
      <path class="branch" d="M32 16 C24 16 16 24 16 32" />
      <path class="bark" d="M29 16.4 C24 16.8 19.5 19.5 17.6 24" />
      <path class="twig" d="M20.7 20.7 Q15.6 15.4 9.6 9.8" />
      <path class="twig" d="M13.6 13.4 L14.2 7.6" />
      <path class="twig" d="M13.4 13.6 L7.6 14.2" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(9.6 9.8) rotate(-135)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(14.2 7.6) rotate(-95)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(7.6 14.2) rotate(-175)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(17.2 26) rotate(170)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(26 17.2) rotate(-80)" />
      <ellipse class="knot" cx="18.3" cy="24.8" rx="0.9" ry="0.65" transform="rotate(-60 18.3 24.8)" />
    </g>
  </defs>

  <use href="#corner" xlink:href="#corner" />
  <use href="#corner" xlink:href="#corner" transform="rotate(90 64 64)" />
  <use href="#corner" xlink:href="#corner" transform="rotate(180 64 64)" />
  <use href="#corner" xlink:href="#corner" transform="rotate(270 64 64)" />

  <use href="#edge" xlink:href="#edge" transform="translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(90 64 64) translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(180 64 64) translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(270 64 64) translate(32 0)" />
</svg>
