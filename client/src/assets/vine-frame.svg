<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Rankenrahmen als 9-Slice für border-image (Slice 32): Ecken 32×32, Kanten-Kachel 64×32.
    Die Ranke läuft in der Mitte des 32er-Bands (y=16) und beginnt/endet dort waagerecht, damit sich die
    Kacheln nahtlos aneinanderreihen. Die übrigen Kanten und Ecken sind Drehungen um die Bildmitte.
    Farben passen sich per prefers-color-scheme dem hellen/dunklen Design an.
  -->
  <style>
    .stem { fill: none; stroke: #5f6f3a; stroke-width: 1.2; stroke-linecap: round; }
    .tendril { fill: none; stroke: #5f6f3a; stroke-width: 0.8; stroke-linecap: round; }
    .leaf { fill: #8aa05a; stroke: #56662f; stroke-width: 0.5; }
    .vein { fill: none; stroke: #56662f; stroke-width: 0.35; }
    @media (prefers-color-scheme: dark) {
      .stem, .tendril { stroke: #8fa36a; }
      .leaf { fill: #4f6436; stroke: #9fb878; }
      .vein { stroke: #9fb878; }
    }
  </style>
  <defs>
    <g id="leaf">
      <path class="leaf" d="M0 0 C2.2 -2.4 5.8 -2.6 8 0 C5.8 2.6 2.2 2.4 0 0Z" />
      <path class="vein" d="M0.8 0 L6.6 0" />
    </g>
    <g id="leaf-small" transform="scale(0.7)"><use href="#leaf" xlink:href="#leaf" /></g>

    <!-- Kante: sanfte S-Welle, Blätter zu beiden Seiten, eine eingerollte Ranke -->
    <g id="edge">
      <path class="stem" d="M0 16 C10 16 14 12 22 12 S34 20 42 20 S56 16 64 16" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(21 12.2) rotate(-125)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(9 15.4) rotate(-35)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(42 19.8) rotate(55)" />
      <path class="tendril" d="M30 15.6 C29 11.6 32.6 9.8 33.8 11.8 C34.6 13.2 32.8 14 32.3 12.9" />
      <path class="tendril" d="M51 18.6 C52 22.6 55.6 23.4 56.4 21.2 C57 19.6 55 19.2 54.8 20.4" />
    </g>

    <!-- Ecke: Bogen von der oberen zur linken Kante, Spirale nach außen, Blätterbüschel -->
    <g id="corner">
      <path class="stem" d="M32 16 C24 16 16 24 16 32" />
      <path class="tendril" d="M20.8 20.8 C16 15.5 8.5 17 7.5 11 C6.8 6.6 11.8 5.2 13 8.4 C13.8 10.6 11.2 11.6 10.4 10" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(27 16.6) rotate(-150)" />
      <use href="#leaf" xlink:href="#leaf" transform="translate(16.6 27) rotate(-120)" />
      <use href="#leaf-small" xlink:href="#leaf-small" transform="translate(21.6 22) rotate(30)" />
    </g>
  </defs>

  <use href="#corner" xlink:href="#corner" />
  <use href="#corner" xlink:href="#corner" transform="rotate(90 64 64)" />
  <use href="#corner" xlink:href="#corner" transform="rotate(180 64 64)" />
  <use href="#corner" xlink:href="#corner" transform="rotate(270 64 64)" />

  <use href="#edge" xlink:href="#edge" transform="translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(90 64 64) translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(180 64 64) translate(32 0)" />
  <use href="#edge" xlink:href="#edge" transform="rotate(270 64 64) translate(32 0)" />
</svg>
