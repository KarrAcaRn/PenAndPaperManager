<!doctype html>
<html lang="de" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen &amp; Paper Manager</title>
    <!--
      Design-Tokens: das Basis-Theme ist immer geladen (fehlt ein gewähltes Theme, bleibt die Seite gestaltet).
      Das zuletzt angewendete Theme und Farbschema (lib/userSettings.svelte.ts) setzt das Skript darunter vor dem
      ersten Zeichnen: Der per document.write eingefügte Link blockiert das Rendern wie ein normaler, so blitzt
      nichts auf. applyTheme() (lib/theme.ts) tauscht #theme-stylesheet später zur Laufzeit aus.
    -->
    <link id="theme-base" rel="stylesheet" href="/themes/default/theme.css" vite-ignore />
    <script>
      (function () {
        var root = document.documentElement;
        var id = null;
        var scheme = null;
        try {
          id = localStorage.getItem('pnp-theme-id');
          scheme = localStorage.getItem('pnp-color-scheme');
          // früher stand das Farbschema unter pnp-theme
          var legacy = localStorage.getItem('pnp-theme');
          if (legacy !== null) {
            localStorage.removeItem('pnp-theme');
            if (scheme === null && (legacy === 'light' || legacy === 'dark')) {
              scheme = legacy;
              localStorage.setItem('pnp-color-scheme', legacy);
            }
          }
        } catch (e) {}
        if (scheme === 'light' || scheme === 'dark') root.setAttribute('data-color-scheme', scheme);
        if (id && /^[a-z0-9][a-z0-9-]{0,39}$/.test(id) && id !== 'default') {
          // Fehlt das Theme inzwischen, bleibt das Basis-Theme; die App wendet danach die Vorgabe der Seite an
          document.write(
            '<link id="theme-stylesheet" rel="stylesheet" href="/themes/' + id + '/theme.css"' +
              ' onerror="this.remove(); document.documentElement.setAttribute(\'data-theme\', \'default\')" />',
          );
          root.setAttribute('data-theme', id);
        }
      })();
    </script>
    <!-- Schriften des FATE-Bogens -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
