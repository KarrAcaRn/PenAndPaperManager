<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!--
    Zierrahmen als 9-Slice für border-image (Token frame-slice 24, frame-width 24px):
    Das Bild wird in ein 3×3-Raster mit 24er-Bändern zerlegt. Die vier Ecken (24×24) bleiben unverändert,
    die vier Kantenstücke werden entlang der Kante gestreckt bzw. wiederholt (frame-repeat), die Mitte entfällt.
    Deshalb liegen die Rauten nur in den Ecken und in den Kanten nur gerade Linien.
    Farben per prefers-color-scheme passend zum hellen/dunklen Farbschema (wie darkTokens im Manifest).
  -->
  <style>
    .line { fill: none; stroke: #1d6b5a; }
    .gem { fill: #1d6b5a; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #5cc4a8; }
      .gem { fill: #5cc4a8; }
    }
  </style>
  <rect class="line" x="7" y="7" width="58" height="58" stroke-width="2" />
  <rect class="line" x="11.5" y="11.5" width="49" height="49" stroke-width="1" />
  <path class="gem" d="M7 1 L13 7 L7 13 L1 7Z M65 1 L71 7 L65 13 L59 7Z M7 59 L13 65 L7 71 L1 65Z M65 59 L71 65 L65 71 L59 65Z" />
</svg>
