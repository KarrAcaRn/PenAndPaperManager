<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    Pergament-Struktur: halbtransparentes, nahtlos kachelndes Rauschen (stitchTiles), das über der Hintergrundfarbe
    liegt. Deckkraft höchstens 0.25 × 0.35 ≈ 9 % Braun, damit der Textkontrast erhalten bleibt (geprüft in
    server/test/builtin-themes.test.ts mit 12 %). Selbst erstellt, MIT-Lizenz.
  -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="7" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.55 -0.2" />
  </filter>
  <rect width="400" height="400" filter="url(#grain)" opacity="0.25" />
</svg>
